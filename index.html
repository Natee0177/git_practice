<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人自我介紹網站</title>
    <style>
        /* 基礎重置與全域樣式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }
        
        /* 頁首區塊 */
        header {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* 主要內容區塊 */
        main {
            max-width: 800px;
            margin: -40px auto 40px auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        section {
            margin-bottom: 30px;
        }
        section h2 {
            font-size: 1.5rem;
            color: #4a4a4a;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        /* 技能標籤樣式 */
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
        }
        .skills-list li {
            background: #eef2ff;
            color: #4f46e5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 頁尾區塊 */
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 頁首：自我介紹標題 -->
    <header>
        <h1>你好，我是 </h1>
        <p>歡迎來到我的個人自我介紹網站</p>
    </header>

    <!-- 主要內容 -->
    <main>
        <!-- 關於我 -->
        <section>
            <h2>關於我</h2>
            <p>個人簡介。背景、興趣、熱情所在，正在學習的專業領域。</p>
        </section>

        <!-- 專業技能 -->
        <section>
            <h2>專業技能</h2>
            <ul class="skills-list">
                <li>HTML / CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
                <li>網頁前端設計</li>
            </ul>
        </section>

        <!-- 聯絡方式 -->
        <section>
            <h2>聯絡方式</h2>
            <p>如果您想與我交流或合作，歡迎透過以下方式聯繫我：</p>
            <p>電子郵件：example@email.com</p>
        </section>
    </main>

    <!-- 頁尾 -->
    <footer>
        <p>&copy; 2026 . All Rights Reserved.</p>
    </footer>

</body>
</html>
